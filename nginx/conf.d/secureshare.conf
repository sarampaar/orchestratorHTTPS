# Dockerized Global Nginx Configuration for SecureShare / Matrimonial Proxy
# This file is automatically loaded by the global_nginx container because it's inside the conf.d directory.

server {
    listen 80;
    listen [::]:80;
    server_name secureshare.theengineer.co.in;

    # Secure uploads limit configuration inside proxy
    client_max_body_size 15M;

    # Forward all browser requests to matrimonial docker container over the shared 'factory_net' network
    location / {
        proxy_pass http://matrimonial:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Buffer and timeout optimizations for smooth image downloads
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    # Block access to hidden profiles/git/configs at proxy level
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
