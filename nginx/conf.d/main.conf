server {
    listen 80;
    server_name yourdomain.com; # Replace with your domain

    # Website / Ebook Layer (Static)
    location / {
        root /var/www/main-site;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # Android App / Dynamic Layer (Sidecar API)
    # This is a placeholder for when you add a Python/Node container
    location /api/ {
        proxy_pass http://api_container:5000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # YouTube Archive / Media Layer
    location /videos/ {
        alias /var/www/youtube-archive/;
        autoindex on;
    }
}
