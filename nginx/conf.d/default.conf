server {
    listen 80 default_server;
    server_name _;

    # Base directory for all domains
    set $base_root /var/www;
    
    # Try to use a folder matching the requested domain (e.g., /var/www/kakapo.in)
    root $base_root/$host;
    index index.html;

    # 1. Try to serve exact file requested
    # 2. Try to serve directory index
    # 3. If domain folder/file doesn't exist, fallback to the default site
    location / {
        try_files $uri $uri/ @fallback;
    }

    # The fallback default 200 OK welcome page
    location @fallback {
        root $base_root/default;
        try_files /index.html =404;
    }
}
