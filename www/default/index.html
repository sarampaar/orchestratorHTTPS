<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #334155;
            overflow: hidden;
        }
        .container {
            background: white;
            padding: 4rem;
            border-radius: 16px;
            text-align: center;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            max-width: 500px;
            width: 90%;
        }
        .container:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin: 0 0 1rem 0;
            color: #0f172a;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #64748b;
            margin: 0;
        }
        .badge {
            display: inline-block;
            background: #f1f5f9;
            color: #475569;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 2rem;
            border: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Domain Active</div>
        <h1>Welcome</h1>
        <p>This domain has been successfully parked and is currently awaiting content.</p>
    </div>
</body>
</html>
