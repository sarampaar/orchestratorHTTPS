<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to hiremytime.org</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #be123c 0%, #4338ca 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            padding: 4.5rem;
            border-radius: 24px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
            max-width: 550px;
            width: 90%;
        }
        .container:hover {
            transform: scale(1.02);
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin: 0 0 1rem 0;
        }
        p {
            font-size: 1.15rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.85);
            margin: 0;
            font-weight: 300;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(90deg, #f43f5e, #8b5cf6);
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 2rem;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Professional Network</div>
        <h1>hiremytime.org</h1>
        <p>Connecting expertise with opportunity. Our platform is launching soon.</p>
    </div>
</body>
</html>
