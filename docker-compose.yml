services:
  tunnel:
    container_name: tunnel  # Fixed name for terminal commands
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - factory_net

  global_nginx:
    container_name: global_nginx  # Fixed name for Cloudflare Service URL
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./www:/var/www:ro
    networks:
      - factory_net

networks:
  factory_net:
    driver: bridge
