services:
  tunnel:
    container_name: tunnel  # Fixed name for terminal commands
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - factory_net

  global_nginx:
    container_name: global_nginx  # Fixed name for Cloudflare Service URL
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./www:/var/www:ro
    networks:
      - factory_net

  global_postgres:
    container_name: global_postgres
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-securepassword123}
      - POSTGRES_DB=orchestrator_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - factory_net

  db_admin:
    container_name: db_admin
    image: adminer
    restart: always
    environment:
      - ADMINER_DEFAULT_SERVER=global_postgres
    networks:
      - factory_net

networks:
  factory_net:
    driver: bridge
