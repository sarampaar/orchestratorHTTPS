services:
  tunnel:
    container_name: tunnel  # Fixed name for terminal commands
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - factory_net

  global_nginx:
    container_name: global_nginx  # Fixed name for Cloudflare Service URL
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./www:/var/www:ro
    networks:
      - factory_net

  global_postgres:
    container_name: global_postgres
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-securepassword123}
      - POSTGRES_DB=orchestrator_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - factory_net

  db_admin:
    container_name: db_admin
    image: adminer
    restart: always
    environment:
      - ADMINER_DEFAULT_SERVER=global_postgres
    networks:
      - factory_net

  nextjs_demo:
    container_name: nextjs_demo
    build: ./apps/nextjs-demo
    restart: always
    networks:
      - factory_net

  domain_checker:
    container_name: domain_checker
    build: ./apps/domain-checker
    restart: always
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-securepassword123}@global_postgres:5432/orchestrator_db?schema=domain_checker
      - DELAY_MS=5000
    networks:
      - factory_net

  agentic_ai_llama_server:
    container_name: agentic_ai_llama_server
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: always
    volumes:
      - ./apps/agentic_ai/models:/models
    command: >
      --model /models/qwen1_5-7b-chat-q4_k_m.gguf
      --host 0.0.0.0
      --port 8080
      --ctx-size 2048
    networks:
      - factory_net

  agentic_ai_webui:
    container_name: agentic_ai_webui
    image: ghcr.io/open-webui/open-webui:main
    restart: always
    environment:
      - OPENAI_API_BASE_URL=http://agentic_ai_llama_server:8080/v1
      - OPENAI_API_KEY=dummy-key
    volumes:
      - ./apps/agentic_ai/webui-data:/app/backend/data
    networks:
      - factory_net

networks:
  factory_net:
    driver: bridge
