services:
  # This IS the tunnel. Name it exactly "tunnel" for the script to work.
  tunnel:
    container_name: tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - orchestration_net

  # This is the Router for all your Apps, Ebooks, and Websites.
  global_nginx:
    container_name: global_nginx
    image: nginx:alpine
    restart: always
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./www:/var/www:ro
    networks:
      - orchestration_net

networks:
  orchestration_net:
    driver: bridge
