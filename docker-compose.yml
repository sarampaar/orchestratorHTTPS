services:
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel run
    networks:
      - factory_net  # They must be in the same network

  global_nginx:
    image: nginx:alpine
    container_name: global_nginx
    restart: always
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./www:/var/www:ro
    networks:
      - factory_net

networks:
  factory_net:
    driver: bridge
