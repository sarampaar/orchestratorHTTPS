name: Sync AI Infrastructure
on:
  workflow_dispatch:

jobs:
  deploy-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.GLOBAL_VPS_IP }}" ]; then
            echo "ERROR: GLOBAL_VPS_IP secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.GLOBAL_SSH_KEY }}" ]; then
            echo "ERROR: GLOBAL_SSH_KEY secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.CF_TUNNEL_TOKEN }}" ]; then
            echo "ERROR: CF_TUNNEL_TOKEN secret is not set."
            exit 1
          fi

      - name: Save SSH key
        run: |
          mkdir -p ~/.ssh
          echo -e "${{ secrets.GLOBAL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        shell: bash

      - name: Verify SSH connectivity
        run: |
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -p 2256 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${{ secrets.GLOBAL_VPS_IP }} 'echo SSH OK'
        shell: bash

      - name: Prep VPS Directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_VPS_SSH_KEY || secrets.GLOBAL_SSH_KEY }}
          port: 2256
          script: |
            mkdir -p ~/orchestrator/apps/agentic_ai

      - name: Sync AI Configuration Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_VPS_SSH_KEY || secrets.GLOBAL_SSH_KEY }}
          port: 2256
          # We only sync the docker-compose file and the AI apps folder
          source: "docker-compose.yml,apps/agentic_ai"
          target: "~/orchestrator"

      - name: Boot AI Engine
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_VPS_SSH_KEY || secrets.GLOBAL_SSH_KEY }}
          port: 2256
          script: |
            cd ~/orchestrator
            export CF_TUNNEL_TOKEN=${{ secrets.CF_TUNNEL_TOKEN }}
            export POSTGRES_USER=${{ secrets.POSTGRES_USER || 'admin' }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'securepassword123' }}
            
            # Start only the AI containers and the tunnel
            docker compose up -d --build agentic_ai_llama_server agentic_ai_webui tunnel
            
            echo "--- AI Containers Status ---"
            docker ps --filter "name=agentic_ai" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
