name: Sync Infrastructure to VPS
on:
  push:
    branches: [ main, master ] # Trigger on either name

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    # This prevents the action from running on forks of your public repo
    if: github.repository == 'your-org-name/infra-orchestrator' 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Config Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_SSH_KEY }}
          source: "docker-compose.yml,nginx/conf.d/*"
          target: "/root/orchestrator"

      - name: Execute Remote Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_SSH_KEY }}
          script: |
            cd /root/orchestrator
            mkdir -p www/main-site
            export CF_TUNNEL_TOKEN=${{ secrets.CF_TUNNEL_TOKEN }}
            docker-compose up -d --remove-orphans
            docker exec global_nginx nginx -s reload
