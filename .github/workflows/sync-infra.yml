name: Sync Infrastructure
on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prep VPS Directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_SSH_KEY }}
          script: |
            mkdir -p ~/orchestrator/nginx/conf.d ~/orchestrator/www/main-site
            echo "<h1>Orchestration Active: 200 OK</h1>" > ~/orchestrator/www/main-site/index.html

      - name: Sync Configuration Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_SSH_KEY }}
          source: "docker-compose.yml,nginx/conf.d/*"
          target: "~/orchestrator"

      - name: Boot Engine
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_SSH_KEY }}
          script: |
            cd ~/orchestrator
            export CF_TUNNEL_TOKEN=${{ secrets.CF_TUNNEL_TOKEN }}
            docker-compose up -d --force-recreate
            sleep 5
            echo "--- Tunnel container status ---"
            docker ps --filter "name=tunnel" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            if [ "$(docker ps --filter "name=tunnel" --format '{{.Names}}')" != "tunnel" ]; then
              echo "ERROR: Tunnel container is not running or was not created."
              docker ps -a --filter "name=tunnel"
              docker logs tunnel --tail 20 || true
              exit 1
            fi
            echo "--- Tunnel logs ---"
            docker logs tunnel --tail 20
            docker exec global_nginx nginx -s reload
