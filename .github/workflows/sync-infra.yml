name: Sync Infrastructure
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.GLOBAL_VPS_IP }}" ]; then
            echo "ERROR: GLOBAL_VPS_IP secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.GLOBAL_SSH_KEY }}" ]; then
            echo "ERROR: GLOBAL_SSH_KEY secret is not set."
            exit 1
          fi
          if [ -z "${{ secrets.CF_TUNNEL_TOKEN }}" ]; then
            echo "ERROR: CF_TUNNEL_TOKEN secret is not set."
            exit 1
          fi

      - name: Save SSH key
        run: |
          mkdir -p ~/.ssh
          echo -e "${{ secrets.GLOBAL_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        shell: bash

      - name: Verify SSH connectivity
        run: |
          chmod 600 ~/.ssh/id_rsa
          ssh -i ~/.ssh/id_rsa -p 2256 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@${{ secrets.GLOBAL_VPS_IP }} 'echo SSH OK'
        shell: bash

      - name: Prep VPS Directories
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_VPS_SSH_KEY || secrets.GLOBAL_SSH_KEY }}
          port: 2256
          script: |
            mkdir -p ~/orchestrator/nginx/conf.d ~/orchestrator/www

      - name: Sync Configuration Files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_VPS_SSH_KEY || secrets.GLOBAL_SSH_KEY }}
          port: 2256
          source: "docker-compose.yml,nginx/conf.d/*,www,ssg-builder,apps"
          target: "~/orchestrator"

      - name: Boot Engine
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GLOBAL_VPS_IP }}
          username: root
          key: ${{ secrets.GLOBAL_VPS_SSH_KEY || secrets.GLOBAL_SSH_KEY }}
          port: 2256
          script: |
            cd ~/orchestrator
            export CF_TUNNEL_TOKEN=${{ secrets.CF_TUNNEL_TOKEN }}
            export POSTGRES_USER=${{ secrets.POSTGRES_USER || 'admin' }}
            export POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'securepassword123' }}
            docker compose up -d --force-recreate
            sleep 5
            echo "--- Tunnel container status ---"
            docker ps --filter "name=^tunnel$" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            if [ -z "$(docker ps -q --filter "name=^tunnel$")" ]; then
              echo "ERROR: Tunnel container is not running or was not created."
              docker ps -a --filter "name=tunnel"
              docker logs tunnel --tail 20 || true
              exit 1
            fi
            echo "--- Tunnel logs ---"
            docker logs tunnel --tail 20
            docker exec global_nginx nginx -s reload
            
            echo "--- Generating Static Sites via Node SSG ---"
            export DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@global_postgres:5432/orchestrator_db"
            docker run --rm \
              --network orchestrator_factory_net \
              -v ~/orchestrator/ssg-builder:/app \
              -v ~/orchestrator/www:/www \
              -w /app \
              -e DATABASE_URL=${DATABASE_URL} \
              node:18 \
              sh -c "npm install && npx prisma generate && npx prisma db push --accept-data-loss && node seed.js && node build.js"
